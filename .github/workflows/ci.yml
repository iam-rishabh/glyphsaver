name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Tkinter, virtual display)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb xprintidle

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-line-length=110 --statistics

      - name: Byte-compile check
        run: python -m py_compile glyphsaver.py idle_watcher.py glyphs/*.py

      - name: Run tests
        run: xvfb-run -a python -m pytest -v

      - name: Shellcheck install.sh
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          ignore_paths: ".git"
